name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter 3.35.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Versions
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Pub get
        run: flutter pub get

      - name: Analyse (non-blocking)
        continue-on-error: true
        run: flutter analyze || true

      - name: Build release APK (arm64-v8a)
        id: build
        continue-on-error: true
        run: |
          set +e
          flutter build apk --release --flavor normal --target-platform android-arm64 --verbose > /tmp/build.log 2>&1
          echo "flutter exit code = $?"
          echo "================= Dart 编译错误 ================="
          grep -nE "^Error:|^.*\.dart:[0-9]+:[0-9]+: Error:|Error: .*\.dart" /tmp/build.log | head -60 || true
          echo "================= Gradle 错误 ================="
          grep -nE 'FAILED|What went wrong|Execution failed|Caused by' /tmp/build.log | tail -25 || true
          echo "================= 最后 80 行 ================="
          tail -80 /tmp/build.log || true

      - name: Collect
        run: |
          set -e
          mkdir -p out
          SRC="build/app/outputs/flutter-apk/app-normal-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "!! 没找到 $SRC，尝试全盘搜索"
            SRC=$(find . -name 'app-normal-release.apk' -o -name 'app-release.apk' | head -1)
          fi
          [ -n "$SRC" ] && [ -f "$SRC" ] || { echo "❌ 构建产物不存在"; exit 1; }
          echo "采用产物: $SRC"
          cp "$SRC" out/shenye-liuli-arm64.apk
          ls -lh out/
          sha256sum out/*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shenye-liuli-arm64
          path: out/shenye-liuli-arm64.apk
          retention-days: 30

      - name: Publish to latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: out/shenye-liuli-arm64.apk
          body: |
            AstrBot 深夜流璃 · Android 客户端（arm64-v8a）

            基于 Flutter 3.35.7 自动构建。
            内置 proot + Ubuntu 24.04 rootfs，免 Termux 直接运行 AstrBot。
