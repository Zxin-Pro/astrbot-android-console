name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 查看 runner 自带的 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "(无)"
          echo "--- platforms   ---"; ls "$ANDROID_HOME/platforms"   2>/dev/null || echo "(无)"
          echo "--- cmdline-tools ---"; ls "$ANDROID_HOME/cmdline-tools" 2>/dev/null || echo "(无)"

      - name: 确保 build-tools 34 与 platform 34 就绪
        run: |
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -n "$SDKMANAGER" ]; then
            echo "sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          else
            echo "未找到 sdkmanager，将直接使用 runner 已有组件"
          fi
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools"
          echo "--- platforms   ---"; ls "$ANDROID_HOME/platforms"

      - name: 构建 APK
        run: bash scripts/build.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: astrbot-console-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AstrBot 控制台 · 最新构建
          body: |
            自动构建的 **AstrBot + NapCat 安卓控制台** APK。

            - 支持 Android 5.0+（API 21+）
            - 内嵌 AstrBot / NapCat 管理面板
            - 一键调用 Termux 安装 / 启动 / 停止 / 看日志

            使用前请在 Termux 中开启外部调用：
            `~/.termux/termux.properties` 里设置 `allow-external-apps=true`
          files: dist/*.apk
          make_latest: true
